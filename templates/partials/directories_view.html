<section id="directories-view" class="content-section hidden">
    <div class="page-heading">
        <div>
            <div class="eyebrow">Администрирование</div>
            <h2>Справочники</h2>
            <p>Управление группами, преподавателями, дисциплинами и аудиториями.</p>
        </div>
    </div>

    <div class="directory-grid">
        <article class="directory-card">
            <header>
                <div><span class="directory-icon">Г</span><h3>Группы</h3></div>
                <button class="button button-small" data-add="groups">+ Добавить</button>
</header>
            <div id="groups-list"></div>
        </article>

        <article class="directory-card">
            <header>
                <div><span class="directory-icon">П</span><h3>Преподаватели</h3></div>
                <button class="button button-small" data-add="teachers">+ Добавить</button>
            </header>
            <div id="teachers-list"></div>
        </article>

        <article class="directory-card">
            <header>
                <div><span class="directory-icon">Д</span><h3>Дисциплины</h3></div>
                <button class="button button-small" data-add="subjects">+ Добавить</button>
            </header>
            <div id="subjects-list"></div>
        </article>

        <article class="directory-card">
            <header>
                <div><span class="directory-icon">А</span><h3>Аудитории</h3></div>
                <button class="button button-small" data-add="classrooms">+ Добавить</button>
            </header>
            <div id="classrooms-list"></div>
        </article>
    </div>
</section>
