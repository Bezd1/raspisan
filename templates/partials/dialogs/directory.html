<dialog id="directory-dialog" class="dialog">
    <form id="directory-form" class="dialog-card">
        <header class="dialog-header">
            <div>
                <div class="eyebrow">Справочник</div>
                <h2 id="directory-title">Новая запись</h2>
            </div>
            <button type="button" class="icon-button" data-close>×</button>
</header>

        <input id="directory-type" type="hidden">
        <div id="directory-error" class="dialog-error hidden" role="alert" aria-live="assertive"></div>
        <div id="directory-fields"></div>

        <footer class="dialog-actions">
            <span></span>
            <button type="button" class="button button-secondary" data-close>Отмена</button>
            <button class="button button-primary">Добавить</button>
        </footer>
    </form>
</dialog>
