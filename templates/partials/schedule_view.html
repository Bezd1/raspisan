<section id="schedule-view" class="content-section">
    <div class="schedule-toolbar">
        <div class="week-switcher">
            <button class="week-button active" data-week="1">1-я неделя</button>
            <button class="week-button" data-week="2">2-я неделя</button>
        </div>

        <span id="current-week-label" class="current-week-label">1-я неделя</span>

        <label class="search-field">
            ⌕
            <input id="search-input" type="search" placeholder="Поиск по расписанию">
        </label>

        <div class="toolbar-actions admin-only">
            <button id="copy-week-button" class="button button-secondary">
                Копировать неделю
            </button>
            <button id="add-lesson-button" class="button button-primary">
                + Новое занятие
            </button>
        </div>
    </div>

    <div class="dashboard-grid">
        <section class="schedule-panel">
            <div class="panel-head">
                <div>
                    <b>Расписание</b>
                    <span>Дни недели и учебные пары</span>
                </div>
                <div class="stats-inline">
                    <span><b id="stat-lessons">0</b> занятий</span>
                    <span><b id="stat-groups">0</b> групп</span>
                </div>
            </div>

            <div class="schedule-wrap">
                <div class="schedule">
                    <div class="schedule-head">
                        <div class="head-day">День / пара</div>
                        <div>1 пара</div>
                        <div>2 пара</div>
                        <div>3 пара</div>
                        <div>4 пара</div>
                    </div>
                    <div id="schedule-body"></div>
                </div>
            </div>

            <div class="schedule-groups">
                <div>
                    <b>Учебные группы</b>
                    <span>Все группы всегда отображаются снизу</span>
                </div>
                <div id="schedule-groups-list" class="schedule-groups-list"></div>
            </div>
        </section>

        <aside class="teachers-panel">
            <div class="panel-head compact">
                <div>
                    <b>Преподаватели</b>
                    <span><b id="stat-teachers">0</b> преподавателей</span>
                </div>
            </div>

            <label class="teacher-search">
                ⌕
                <input id="teacher-search" type="search" placeholder="Поиск преподавателя">
            </label>

            <div id="teachers-panel-list" class="teachers-list"></div>
        </aside>
    </div>
</section>
